name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel git rust gtk4 libadwaita gtk4-layer-shell ladspa
      - uses: actions/checkout@v7
      - name: Cache cargo registry & build artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-test-
      - run: cargo test

  # Compiles the whole workspace exactly once. Ubuntu 24.04 has the oldest
  # glibc of our three targets (Arch rolling and Fedora latest both ship
  # newer), and shared-library ABI compatibility only runs forward — a
  # binary built against an older glibc/GTK4 runs fine on a newer one, not
  # the other way round. So building here is what makes it safe to reuse
  # these binaries for build-deb and build-rpm below without recompiling.
  build:
    needs: test
    runs-on: ubuntu-24.04
    env:
      # `secrets` isn't a valid context inside a step's `if:` — only inside
      # `env:`/`run:` — so it's mirrored into a job-level env var here and
      # the step below gates on that instead.
      NGC_API_KEY: ${{ secrets.NGC_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev pkg-config ladspa-sdk \
            meson ninja-build libwayland-dev wayland-protocols curl unzip

      - name: Cache cargo registry & build artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-build-

      # Ubuntu 24.04 (noble) only packages the GTK3-only `gtk-layer-shell`
      # library; the GTK4 fork used by broadcast-gui (`gtk4-layer-shell`,
      # a separate upstream project) didn't land in Ubuntu until 25.10.
      # Build it from source instead. Staged into a DESTDIR so the (small,
      # rarely-changing) build output can be cached and just copied into
      # place on a cache hit, instead of re-cloning and recompiling it
      # every run.
      - name: Cache gtk4-layer-shell build
        id: cache-gtk4ls
        uses: actions/cache@v6
        with:
          path: /tmp/gtk4-layer-shell-install
          key: gtk4-layer-shell-v1.3.0-noble
      - name: Build gtk4-layer-shell from source
        if: steps.cache-gtk4ls.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch v1.3.0 \
            https://github.com/wmww/gtk4-layer-shell.git /tmp/gtk4-layer-shell
          cd /tmp/gtk4-layer-shell
          meson setup build --prefix=/usr --libdir=/usr/lib/x86_64-linux-gnu \
            -Dexamples=false -Ddocs=false -Dtests=false -Dintrospection=false -Dvapi=false
          ninja -C build
          DESTDIR=/tmp/gtk4-layer-shell-install ninja -C build install
      - name: Install gtk4-layer-shell
        run: |
          sudo cp -a /tmp/gtk4-layer-shell-install/usr/. /usr/
          sudo ldconfig

      # The SDK download (headers/libs/models) is multi-GB and pinned to a
      # fixed version+effects set inside the script, so it's safe to cache
      # by that version — bump the key if install-maxine-sdk.sh's
      # SDK_VERSION or effects list changes, or if the architecture list
      # below (build-maxine-runtime-bundle.sh) changes. actions/cache only
      # saves an updated cache on a miss, not a hit, so the key has to
      # reflect everything this job downloads into this path — otherwise a
      # hit silently restores a stale subset and every architecture missing
      # from it gets re-downloaded from scratch on every single run.
      - name: Cache Maxine SDK download
        uses: actions/cache@v6
        with:
          path: ~/.local/share/nvidia-maxine-sdk
          key: maxine-sdk-v2.1.0-denoiser-dereverb-t4-a10-l40-rtx_pro_6000

      # ── Optional: download Maxine SDK and build the GPU plugin ─────────
      # Set NGC_API_KEY as a GitHub Actions secret to enable Maxine builds
      # (free key: https://org.ngc.nvidia.com/setup/api-key). Uses the same
      # script a developer runs locally — see broadcast-maxine-ladspa/README.md.
      # No system CUDA/cmake needed: the SDK bundles its own CUDA/TensorRT,
      # and the plugin builds via Cargo's `cc` crate directly.
      - name: Download NVIDIA Maxine SDK and build GPU plugin (optional)
        if: ${{ env.NGC_API_KEY != '' }}
        run: bash scripts/install-maxine-sdk.sh

      # ── Optional: bundle Maxine's runtime (libs + models) for every
      # desktop RTX generation into the release, so most users can enable
      # the Maxine backend without their own NGC key — see
      # scripts/install-maxine-runtime.sh. Reuses the SDK headers/libs the
      # step above already downloaded, just adds the 3 other
      # architectures' models on top.
      - name: Build Maxine runtime bundle for release (optional)
        if: ${{ env.NGC_API_KEY != '' }}
        run: bash scripts/build-maxine-runtime-bundle.sh release/broadcast-maxine-runtime-linux-x86_64.tar.gz

      - name: Build release binaries
        run: |
          if [ -d "$HOME/.local/share/nvidia-maxine-sdk/current" ]; then
            export NVAFX_SDK="$HOME/.local/share/nvidia-maxine-sdk/current"
          fi
          cargo build --release

      - name: Prepare assets
        run: |
          mkdir -p release
          cp target/release/broadcast-ctl release/
          cp target/release/broadcast-gui release/
          chmod +x release/broadcast-ctl release/broadcast-gui
          # Include Maxine plugin only if it has the ladspa_descriptor symbol (not an empty stub)
          if [ -f target/release/libbroadcast_maxine_ladspa.so ]; then
            if nm target/release/libbroadcast_maxine_ladspa.so 2>/dev/null | grep -q ladspa_descriptor; then
              cp target/release/libbroadcast_maxine_ladspa.so release/
              echo "Maxine plugin included in release"
            fi
          fi
          cd release
          tar_files=(broadcast-ctl broadcast-gui)
          [ -f libbroadcast_maxine_ladspa.so ] && tar_files+=(libbroadcast_maxine_ladspa.so)
          tar czf broadcast-x86_64-linux.tar.gz "${tar_files[@]}"

      - uses: actions/upload-artifact@v7
        with:
          name: linux-binaries
          path: release/

  # Packaging only — no compiler, no GTK dev headers, no gtk4-layer-shell
  # build. Just takes the binaries the `build` job already produced and
  # wraps them in a .deb.
  build-deb:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Download binaries from build job
        uses: actions/download-artifact@v8
        with:
          name: linux-binaries
          path: target/release/
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo-deb binary
        id: cache-cargo-deb
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-deb
          key: cargo-deb-bin-${{ runner.os }}
      - name: Install cargo-deb
        if: steps.cache-cargo-deb.outputs.cache-hit != 'true'
        run: cargo install cargo-deb
      - name: Build deb (broadcast-ctl)
        run: cargo deb -p broadcast-ctl --no-build
      - name: Build deb (broadcast-gui)
        run: cargo deb -p broadcast-gui --no-build
      - name: Collect debs
        run: |
          mkdir -p release
          cp target/debian/*.deb release/
      - uses: actions/upload-artifact@v7
        with:
          name: deb-packages
          path: release/

  # Packaging only, same as build-deb — cargo-generate-rpm never compiles,
  # it just wraps already-built binaries, so no Fedora container needed.
  build-rpm:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download binaries from build job
        uses: actions/download-artifact@v8
        with:
          name: linux-binaries
          path: target/release/
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo-generate-rpm binary
        id: cache-cargo-generate-rpm
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-generate-rpm
          key: cargo-generate-rpm-bin-${{ runner.os }}
      - name: Install cargo-generate-rpm
        if: steps.cache-cargo-generate-rpm.outputs.cache-hit != 'true'
        run: cargo install cargo-generate-rpm
      - name: Generate RPMs
        run: |
          mkdir -p release
          cargo generate-rpm -p broadcast-ctl -o release/
          cargo generate-rpm -p broadcast-gui -o release/
      - uses: actions/upload-artifact@v7
        with:
          name: rpm-packages
          path: release/

  release:
    needs: [build, build-deb, build-rpm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts/
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/linux-binaries/broadcast-ctl
            artifacts/linux-binaries/broadcast-gui
            artifacts/linux-binaries/broadcast-x86_64-linux.tar.gz
            artifacts/linux-binaries/libbroadcast_maxine_ladspa.so
            artifacts/linux-binaries/broadcast-maxine-runtime-linux-x86_64.tar.gz
            artifacts/deb-packages/*.deb
            artifacts/rpm-packages/*.rpm
          generate_release_notes: true
